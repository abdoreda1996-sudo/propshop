# PropShop — store builds. Modelled on the 66inv app's working Codemagic config.
#
# Before the first run (Codemagic → this app → Environment variables / Code signing):
#   Group "propshop" (Secret ON):
#     PROPSHOP_API                       e.g. https://<test-domain>  — the app talks ONLY to this
#   Group "app_store_credentials" (the same ASC API key the 66inv app uses works here):
#     APP_STORE_CONNECT_PRIVATE_KEY, APP_STORE_CONNECT_KEY_IDENTIFIER,
#     APP_STORE_CONNECT_ISSUER_ID, CERT_PRIVATE_KEY
#   Android code signing: upload android/app/upload-keystore.jks with reference name
#     "propshop_upload" (alias "upload"; passwords are in android/key.properties).
#   Google Play: a service-account JSON as GCLOUD_SERVICE_ACCOUNT_CREDENTIALS in group
#     "google_play" — only after the app exists in Play Console and ONE AAB has been
#     uploaded by hand (Play refuses API uploads for a brand-new app).

workflows:
  android-play-internal:
    name: Android — Play internal testing
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      android_signing:
        - propshop_upload
      groups:
        - propshop
        - google_play
      vars:
        PACKAGE_NAME: "com.propshop.app"
    scripts:
      - name: Require the API address
        script: |
          if [ -z "$PROPSHOP_API" ]; then echo "PROPSHOP_API is not set — the app would call the emulator address"; exit 1; fi
      - name: Get packages
        script: flutter pub get
      - name: Tests
        script: flutter test
      - name: Build AAB
        script: |
          BUILD_NUMBER=$(($PROJECT_BUILD_NUMBER + 1))
          flutter build appbundle --release \
            --build-number=$BUILD_NUMBER \
            --obfuscate --split-debug-info=build/debug-info \
            --dart-define=AQAR_API=$PROPSHOP_API
    artifacts:
      - build/app/outputs/bundle/release/*.aab
      - build/debug-info/**
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true
      email:
        recipients:
          - abdoreda1996@gmail.com

  ios-testflight:
    name: iOS — TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - propshop
        - app_store_credentials
      vars:
        BUNDLE_ID: "com.propshop.app"
    scripts:
      - name: Require the API address
        script: |
          if [ -z "$PROPSHOP_API" ]; then echo "PROPSHOP_API is not set"; exit 1; fi
      - name: Get packages
        script: flutter pub get
      - name: Pod install
        script: cd ios && pod install --repo-update
      - name: Code signing
        script: |
          set -e
          keychain initialize
          # Same persistent cert key as the 66inv app, so Apple's 3-certificate limit is
          # not burned by a new distribution certificate on every build.
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --private-key "$APP_STORE_CONNECT_PRIVATE_KEY" \
            --certificate-key=@env:CERT_PRIVATE_KEY \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Version from pubspec, build number from Codemagic
        script: |
          PUBSPEC_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | sed 's/+.*//')
          cd ios
          agvtool new-marketing-version "$PUBSPEC_VERSION"
          agvtool new-version -all "$(($PROJECT_BUILD_NUMBER + 1))"
      - name: Build IPA
        script: |
          flutter build ipa --release \
            --obfuscate --split-debug-info=build/debug-info \
            --dart-define=AQAR_API=$PROPSHOP_API \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - build/debug-info/**
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_store: false
      email:
        recipients:
          - abdoreda1996@gmail.com
